[experiment]
protocol = "L1"
seeds = "200:220"
acquisition_episodes = 40
adaptation_episodes = 40
bootstrap_samples = 2000

[agent]
delay = 3
capacity = 64
agent_mode = "episodic"
read_mode = "intact"
write_enabled = true
policy_mode = "learned"
learning_enabled = true
learning_rate = 0.25

[task]
kind = "reversal-v1"
reversal_episode = 40
